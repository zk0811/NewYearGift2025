<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上传照片生成圣诞树</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>

    <style>
        /* ... 样式保持不变 ... */
        body { font-family: 'Times New Roman', serif; text-align: center; padding: 20px; background: #000; color: #d4af37; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { border: 2px dashed #d4af37; padding: 40px; border-radius: 10px; background: rgba(20, 20, 20, 0.8); max-width: 90%; }
        h1 { margin-bottom: 30px; font-weight: normal; }
        input { margin: 20px 0; color: #fff; }
        button { padding: 12px 30px; background: #d4af37; color: #000; border: none; font-weight: bold; cursor: pointer; font-size: 16px; border-radius: 5px; transition: 0.3s; }
        button:disabled { background: #666; cursor: not-allowed; }
        #status { margin-top: 20px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>
    <div class="box">
        <h1>上传照片生成圣诞树</h1>
        <p>支持高清原图 (最多选 10 张)，生成后发送链接给好友</p>

        <input type="file" id="fileInput" multiple accept="image/*">
        <br>
        <button id="uploadBtn" onclick="uploadFiles()">✨ 生成我的链接 ✨</button>

        <div id="status"></div>
    </div>

    <script>
        // ==========================================
        // 🔴 Supabase 信息保持不变
        // ==========================================
        const projectUrl = 'https://ryqhjxokcjlhdfxmqzjm.supabase.co';
        const projectKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5cWhqeG9rY2psaGRmeG1xemptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc1Mjk4NjMsImV4cCI6MjA4MzEwNTg2M30.8ofjF_8g0wtkTZJKAcVd44mp0OS9RKQFCGC7YB5C_4g';
        // ==========================================

        // ✅ myClient 保持不变
        const myClient = supabase.createClient(projectUrl, projectKey);

        async function uploadFiles() {
            const fileInput = document.getElementById('fileInput');
            const status = document.getElementById('status');
            const btn = document.getElementById('uploadBtn');
            const files = fileInput.files;

            if (files.length === 0) {
                status.textContent = "请先选择照片！";
                return;
            }

            // ✅ 限制最多上传 10 张
            if (files.length > 10) {
                alert("照片太多啦！最多只能选 10 张哦~");
                return;
            }

            btn.disabled = true;
            btn.textContent = "正在压缩并上传...";
            status.textContent = "准备处理 " + files.length + " 张照片...";

            const orderId = Math.random().toString(36).slice(2, 10);

            // ✅ 【关键修改：高清模式参数】
            const compressOptions = {
                maxSizeMB: 2.0,           // 修改 1：允许最大 2MB (原 0.6MB)，保证细节
                maxWidthOrHeight: 2560,   // 修改 2：分辨率提升到 2K (原 1280px)，大屏更清晰
                useWebWorker: true,
                initialQuality: 0.8       // 修改 3：保留 80% 的原始画质
            };

            try {
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${orderId}/${Date.now()}_${i}.${fileExt}`;

                    status.textContent = `正在处理第 ${i + 1} / ${files.length} 张...`;

                    // ✅ 压缩逻辑
                    let fileToUpload = file;
                    try {
                        // 尝试压缩文件
                        fileToUpload = await imageCompression(file, compressOptions);
                        console.log(`原图: ${(file.size/1024).toFixed(2)}KB -> 优化后: ${(fileToUpload.size/1024).toFixed(2)}KB`);
                    } catch (err) {
                        console.warn("压缩失败，将使用原图上传", err);
                    }

                    // ✅ 使用 myClient 上传
                    const { data, error } = await myClient.storage
                        .from('images')
                        .upload(fileName, fileToUpload);

                    if (error) throw error;
                }

                status.textContent = "上传成功！正在跳转...";
                window.location.href = `/tree/${orderId}`;

            } catch (error) {
                console.error(error);
                status.textContent = "上传失败: " + error.message;
                btn.disabled = false;
                btn.textContent = "重试";
            }
        }
    </script>
</body>
</html>
